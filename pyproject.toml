[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-scout-agent"
version = "1.2.0"
description = "A read-only, evidence-backed GitHub research agent."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Ophelia Farrant"}
]
keywords = [
    "github",
    "agent",
    "research-agent",
    "llm",
    "fastapi",
    "cli",
    "tool-calling",
    "evidence-backed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "typer>=0.15,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
github-scout-agent = "github_scout_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not live_github'"
markers = [
    "live_github: explicit real GitHub public REST API verification; never run by default",
]
