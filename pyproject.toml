[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-scout-agent"
version = "0.1.0"
description = "A read-only, evidence-backed GitHub research agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
github-scout-agent = "github_scout_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not live_github'"
markers = [
    "live_github: explicit real GitHub public REST API verification; never run by default",
]
